name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias (fichero de bloqueo)
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Generar documentación (JSDoc)
        run: npm run docs

      - name: Publicar documentación como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: documentacion
          path: docs/api
